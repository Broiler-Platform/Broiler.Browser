name: Set up Broiler.Browser
description: >-
  Installs the .NET SDK the browser builds with. Run this after
  actions/checkout — a local action cannot perform the checkout itself,
  because its own files have to be in the workspace first.

inputs:
  dotnet-version:
    description: .NET SDK version to install.
    required: false
    default: '10.0.x'

runs:
  using: composite
  steps:
    # This action used to initialise the nested submodules Broiler.JS carried
    # (Broiler.DateTime, Broiler.Regex and Broiler.Unicode), which had no
    # top-level checkout to be redirected to. Every component is a NuGet package
    # now and there is no submodule left to initialise at any depth, so the one
    # thing this sets up is the SDK. It stays an action rather than being inlined
    # so that every job in ci.yml and release.yml keeps setting up the same way.
    - name: Set up .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ inputs.dotnet-version }}
