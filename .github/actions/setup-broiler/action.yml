name: Set up Broiler.Browser
description: >-
  Initialises the nested component submodules the browser's project closure
  reaches, and installs the .NET SDK. Run this after actions/checkout with
  `submodules: true` — a local action cannot perform the checkout itself,
  because its own files have to be in the workspace first.

inputs:
  dotnet-version:
    description: .NET SDK version to install.
    required: false
    default: '10.0.x'

runs:
  using: composite
  steps:
    # `submodules: true` on the checkout fetches the top-level components only. A
    # component repository also carries nested checkouts of its own dependencies so it
    # still builds standalone, and those used to have to be initialised here too,
    # because its projects reached them by literal relative path.
    #
    # They no longer do. Every component reference now goes through a root property --
    # $(BroilerDomPath), $(BroilerGraphicsPath), $(BroilerGraphicsRoot),
    # $(BroilerMediaRoot), $(BroilerInputRoot) -- which the root Directory.Build.props
    # sets to the top-level checkout, so the nested copies are not in any solution's
    # project closure and initialising them only costs time. Verified by emptying all
    # of them and building all four solutions clean.
    #
    # Broiler.JS is the exception, and the reason this step still exists: DateTime,
    # Regex and Unicode have no top-level equivalent to be redirected to.
    #
    # A ProjectReference to a missing project is only a restore *warning*, and the
    # build then fails later on missing types, so if a nested checkout ever becomes
    # load-bearing again the symptom will not name it. The `graph` job in ci.yml is
    # what catches the opposite mistake -- a reference that escaped its property and
    # put two assemblies of one name in the graph.
    - name: Initialise nested submodules
      shell: bash
      run: |
        git -C Broiler.JS submodule update --init Broiler.DateTime Broiler.Regex Broiler.Unicode

    - name: Set up .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ inputs.dotnet-version }}
