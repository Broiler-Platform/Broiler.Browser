name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  # A gitlink can point at a commit that was never pushed. It resolves for
  # whoever recorded it and for nobody else, so the tree looks correct locally
  # and every other job in this file dies in `Check out` with `upload-pack: not
  # our ref`, before a single project is restored. That has happened twice, in
  # ce203a1 and again in 4e20dac.
  #
  # Two properties this job has that the failure it replaces does not. It checks
  # out **without submodules** — a job that fetched them would fail in the same
  # step it exists to explain, so do not add `submodules: true` here. And it
  # reports **every** bad pin rather than stopping at the first, because
  # `git submodule update` stops there and tells you nothing about the rest.
  pins:
    name: Submodule pins
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # No submodules, deliberately. See above.
      - name: Check out
        uses: actions/checkout@v7

      # `git ls-remote` would only prove a pin is a branch or tag *tip*, and a
      # pin to any other reachable commit is legitimate. So this asks the remote
      # the same question `git submodule update` asks — fetch exactly this
      # commit — which is the ground truth and costs one shallow fetch each.
      - name: Verify every gitlink exists on its remote
        shell: bash
        run: |
          set -uo pipefail

          resolve() {
            local url="$1" base
            case "$url" in
              ./*|../*)
                base="$(git config --get remote.origin.url)"
                base="${base%.git}"
                while [ "${url#../}" != "$url" ]; do
                  url="${url#../}"
                  base="${base%/*}"
                done
                printf '%s/%s' "$base" "${url#./}"
                ;;
              *) printf '%s' "$url" ;;
            esac
          }

          status=0
          count=0

          while IFS=$'\t' read -r meta path; do
            sha="${meta##* }"
            count=$((count + 1))

            url="$(git config --file .gitmodules --get "submodule.$path.url" || true)"
            if [ -z "$url" ]; then
              echo "::error file=.gitmodules::$path is a gitlink with no submodule.$path.url entry"
              status=1
              continue
            fi
            url="$(resolve "$url")"

            if git fetch --quiet --no-tags --depth=1 "$url" "$sha" 2>/dev/null; then
              printf 'ok       %-20s %s\n' "$path" "$sha"
            else
              printf 'MISSING  %-20s %s\n' "$path" "$sha"
              echo "::error file=.gitmodules::$path is pinned to $sha, which is not reachable from any ref on $url. Either push the commit to that repository, or re-point this gitlink at one that is already there."
              status=1
            fi
          done < <(git ls-tree -r HEAD | grep '^160000 ')

          if [ "$count" -eq 0 ]; then
            echo "::error::No gitlinks found. This check cannot pass vacuously; if the submodules were removed, remove this job with them."
            exit 1
          fi

          echo
          echo "$count gitlink(s) checked."
          exit "$status"

  # Two projects with the same assembly name in one graph is the failure mode this
  # repository keeps hitting: both compile, the copy to the output directory keeps
  # one of them, and the loser's callers die at runtime with a TypeLoadException
  # that names a method rather than a build problem. It shipped once as
  # PngImageCodec.DecodeAsync, and Debug and Release had picked different winners.
  #
  # Evaluation only -- it resolves what each project would produce without building
  # any of it, so it runs in a couple of minutes and fails before the long jobs do.
  graph:
    name: Component graph
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Set up
        uses: ./.github/actions/setup-broiler

      # Broiler.Android.Browser.slnx is absent deliberately: evaluating it needs the
      # android workload, which this job does not install and should not pay for.
      # The `android` job checks that one, after the install it already does.
      - name: Verify one assembly per name
        shell: bash
        run: |
          ./scripts/check-component-graph.sh             Broiler.Windows.Browser.slnx             Broiler.Linux.Browser.slnx             Broiler.Browser.Tests.slnx

      # Debug-VM is a DIFFERENT closure, not the same one built differently:
      # Broiler.Browser.Core's reference to the VM script engine is conditional on
      # it, so this configuration is the only one in which the Broiler.VM
      # assemblies are reachable from a head. The duplicate-name question has to be
      # asked of a closure, so it is asked of this one too. Evaluation only, like
      # the pass above.
      - name: Verify one assembly per name (VM profile)
        shell: bash
        env:
          CONFIGURATION: Debug-VM
        run: |
          ./scripts/check-component-graph.sh             Broiler.Windows.Browser.slnx             Broiler.Linux.Browser.slnx             Broiler.Browser.Tests.slnx

      # Declaring the names is a SEPARATE problem from making them behave, and it
      # is the one no command-line build can notice. Visual Studio maps a solution
      # build type onto a project configuration of the same name and refuses when
      # the project has none; `dotnet build -c Debug-VM` just builds. So Debug-VM
      # shipped, passed every job below, and still gave
      #
      #   Invalid project mappings. See log file
      #
      # against 87 of the 88 projects in the Windows solution the first time anyone
      # opened it. eng/Broiler.ConfigurationNames.targets is the fix; this is the
      # only thing on this side that can see whether it still works.
      #
      # Broiler.Android.Browser.slnx is checked from the `android` job, which
      # installs the workload its projects need. Evaluation only, like the passes
      # above.
      - name: Verify every project declares every build type
        shell: bash
        run: |
          ./scripts/check-configuration-names.sh \
            Broiler.Windows.Browser.slnx \
            Broiler.Linux.Browser.slnx \
            Broiler.Browser.Tests.slnx

      # A configuration name the SDK does not recognise gets neither Optimize nor
      # DebugSymbols: `-c Release-VM` would compile UNOPTIMISED, succeed, and say
      # nothing. eng/Broiler.Configurations.props is what stops that, reaching part
      # of the tree through Directory.Build.props, part through
      # Directory.Build.targets, and Broiler.JS through a chain that submodule's own
      # Directory.Build.targets makes to this repository's.
      #
      # Three routes to one answer is three things that can break independently, and
      # the breakage is silent in every case, so every route is asserted here rather
      # than assumed from having read the files. Evaluation only; no project is built.
      - name: Pin which components the configuration mapping reaches
        shell: bash
        run: |
          set -uo pipefail
          status=0

          optimize() {
            dotnet msbuild "$1" -p:Configuration=Release-VM -getProperty:Optimize -nologo 2>/dev/null | tr -d '[:space:]'
          }

          expect() {
            local want="$1" project="$2" got
            got="$(optimize "$project")"
            if [ "$got" = "$want" ]; then
              printf '   ok  %-6s %s\n' "${want:-<empty>}" "$project"
            else
              echo "::error file=$project::Under Release-VM this project answers Optimize='$got'; docs/vm-javascript-profile.md says '$want'. Update that document and this step together."
              status=1
            fi
          }

          # Reached through Directory.Build.props.
          expect true src/Broiler.Browser.Core/Broiler.Browser.Core.csproj
          expect true Broiler.CSS/Broiler.CSS/Broiler.CSS.csproj
          expect true Broiler.Layout/Broiler.Layout/Broiler.Layout.csproj

          # Reached through Directory.Build.targets, because their own props
          # deliberately does not chain to the root.
          expect true Broiler.Input/src/Broiler.Input/Broiler.Input.csproj
          expect true Broiler.Media/src/Broiler.Media/Broiler.Media.csproj
          expect true Broiler.UI/src/Foundation/Broiler.UI/Broiler.UI.csproj
          expect true Broiler.VM/src/Broiler.VM.Runtime/Broiler.VM.Runtime.csproj

          # Broiler.JS is the only submodule with a Directory.Build.targets of its
          # own, so the root's never reached it and this line asserted '' for as long
          # as that was true. It now chains to the parent, which is what makes it
          # answer like everything else -- and one project per family, because that
          # one file wins for all four and a regression would take all four with it.
          expect true Broiler.JS/Broiler.JS/Broiler.JavaScript.Engine/Broiler.JavaScript.Engine.csproj
          expect true Broiler.JS/Broiler.Regex/Broiler.Regex/Broiler.Regex.csproj
          expect true Broiler.JS/Broiler.DateTime/src/Broiler.DateTime/Broiler.DateTime.csproj
          expect true Broiler.JS/Broiler.Unicode/src/UnicodeProperties/UnicodeProperties.csproj

          exit "$status"

      # The mapping must apply ONCE. Four submodules vendor their own copy of it for
      # their standalone builds, so for the -Linux/-Windows names the configuration is
      # already decomposed by the time the targets-side import runs; without the guard
      # in eng/Broiler.Configurations.props that appended RELEASE and WINDOWS a second
      # time. Harmless to the compiler, but it makes the constants list depend on which
      # component you ask, which is the question that file exists to answer.
      #
      # Broiler.UI was the one component this list had to leave out, because it both
      # chains to the root props AND carries a copy, so both ran at props time where no
      # guard on this side could see the second. It now guards its own copy on the same
      # property (Broiler.UI#61) and is asserted here like everything else.
      - name: Verify the mapping is applied once
        shell: bash
        run: |
          set -uo pipefail
          status=0

          for project in \
            Broiler.Input/src/Broiler.Input/Broiler.Input.csproj \
            Broiler.Media/src/Broiler.Media/Broiler.Media.csproj \
            Broiler.JS/Broiler.JS/Broiler.JavaScript.Engine/Broiler.JavaScript.Engine.csproj \
            Broiler.UI/src/Foundation/Broiler.UI/Broiler.UI.csproj \
            Broiler.CSS/Broiler.CSS/Broiler.CSS.csproj \
            src/Broiler.Browser.Core/Broiler.Browser.Core.csproj
          do
            constants="$(dotnet msbuild "$project" -p:Configuration=Release-Windows -getProperty:DefineConstants -nologo 2>/dev/null | tr -d '[:space:]')"
            count="$(printf '%s' "$constants" | tr ';' '\n' | grep -c '^RELEASE$' || true)"
            if [ "$count" = "1" ]; then
              printf '   ok  RELEASE x1  %s\n' "$project"
            else
              echo "::error file=$project::Release-Windows defines RELEASE $count times ($constants). The configuration mapping ran more than once; see the guard in eng/Broiler.Configurations.props."
              status=1
            fi
          done

          exit "$status"

  # The DOM bridge is being moved off Broiler.JS and onto the engine-neutral
  # contracts in src/Broiler.HtmlBridge.Jseal, and that is 250 files. A migration
  # that size lands incrementally or not at all — and the way an incremental one
  # fails is not that it stalls, it is that new bindings keep being written in the
  # old vocabulary, because the neighbouring file still uses it and nothing says
  # not to. It then finishes wherever the two rates met, with nobody able to name
  # what is left.
  #
  # eng/jseal-budget.json records today's coupling per project and this job
  # recounts it: a project that went UP fails, and a project that came in under
  # its budget is reported so the number gets lowered in the same commit. It also
  # guards the one neutrality claim the compiler makes rather than the budget —
  # Broiler.HtmlBridge.Jseal.csproj referencing nothing at all — because every 0
  # in that file is only worth reading while that holds.
  neutrality:
    name: Engine neutrality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # No submodules and no dotnet, deliberately. The script reads this
      # repository's own .cs files as text and its own .csproj files as XML; it
      # restores nothing, evaluates nothing and builds nothing, so it answers in
      # under a second and can fail a pull request before anything long starts.
      - name: Check out
        uses: actions/checkout@v7

      - name: Verify no project gained engine coupling
        shell: bash
        run: ./scripts/check-engine-neutrality.sh

  # The .slnx files are generated from eng/solutions.json. A hand-edit to one is
  # silently reverted by the next generator run, so the only thing keeping them
  # true is failing here when a checked-in solution no longer matches the real
  # reference graph. This also catches the subtler case: adding a ProjectReference
  # without regenerating leaves the new project out of every solution.
  solutions:
    name: Solution manifest
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Set up
        uses: ./.github/actions/setup-broiler

      - name: Verify the generated solutions
        shell: pwsh
        run: ./scripts/update-solutions.ps1 -Verify

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false
      matrix:
        include:
          # The Windows head targets net10.0-windows and renders through Direct2D,
          # so it only builds on Windows.
          - name: Windows head
            os: windows-latest
            solution: Broiler.Windows.Browser.slnx
            configuration: Release
            test: false
          # The Linux head is plain net10.0 with P/Invoke into X11 and GL, so it
          # compiles anywhere; building it on Linux keeps that honest.
          - name: Linux head
            os: ubuntu-latest
            solution: Broiler.Linux.Browser.slnx
            configuration: Release
            test: false
          # The suite is all net10.0. Running it on both hosts is deliberate: the
          # shared chrome does clipboard and file-dialog work that is easy to make
          # accidentally platform-specific.
          - name: Tests (Linux)
            os: ubuntu-latest
            solution: Broiler.Browser.Tests.slnx
            configuration: Release
            test: true
          - name: Tests (Windows)
            os: windows-latest
            solution: Broiler.Browser.Tests.slnx
            configuration: Release
            test: true
          # Release-VM builds the browser against the Broiler.VM JavaScript profile
          # (docs/vm-javascript-profile.md). The suite is the entry that carries its
          # weight: VmScriptEngineTests is compiled only under this configuration, so
          # this job is the one that runs JavaScript on the VM rather than only
          # linking it. A configuration nothing builds is a configuration that rots,
          # and this one changes the project graph rather than just a runtime
          # identifier, so "it still compiles" is a real question about it.
          - name: Tests (Linux, VM profile)
            os: ubuntu-latest
            solution: Broiler.Browser.Tests.slnx
            configuration: Release-VM
            test: true
          # And one real head under the same configuration, on the other host: the
          # heads add the platform backends over Broiler.Browser.Core, and the
          # Windows one is the combination -- net10.0-windows plus the VM's net10.0
          # assemblies -- that nothing else here covers.
          - name: Windows head (VM profile)
            os: windows-latest
            solution: Broiler.Windows.Browser.slnx
            configuration: Release-VM
            test: false

    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Set up
        uses: ./.github/actions/setup-broiler

      - name: Build
        run: dotnet build ${{ matrix.solution }} -c ${{ matrix.configuration }}

      - name: Test
        if: matrix.test
        run: dotnet test ${{ matrix.solution }} -c ${{ matrix.configuration }} --no-build

  # Split out because it needs the android workload, which costs several minutes
  # the other jobs should not pay for.
  android:
    name: Android head
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Set up
        uses: ./.github/actions/setup-broiler

      # net10.0-android needs the workload for the Mono runtime packs; without it
      # the restore fails outright rather than degrading.
      - name: Install the Android workload
        run: dotnet workload install android

      # The other three solutions are checked in the `graph` job; this one needs the
      # workload installed above to evaluate at all, so it is checked here.
      - name: Verify one assembly per name
        shell: bash
        run: ./scripts/check-component-graph.sh Broiler.Android.Browser.slnx

      - name: Verify every project declares every build type
        shell: bash
        run: ./scripts/check-configuration-names.sh Broiler.Android.Browser.slnx

      - name: Build
        run: dotnet build Broiler.Android.Browser.slnx -c Release

  # The heads publish through configurations the solutions do not declare
  # (Release-Windows / Release-Linux pin win-x64 and linux-x64). Those have to be
  # project-level builds — a solution-level build with an undeclared configuration
  # fails MSB4126 — so they are exercised here rather than in `build`, and this is
  # the path release.yml takes.
  publish:
    name: Publish ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            project: src/Broiler.Browser.Windows/Broiler.Browser.Windows.csproj
            configuration: Release-Windows
          - os: ubuntu-latest
            rid: linux-x64
            project: src/Broiler.Browser.Linux/Broiler.Browser.Linux.csproj
            configuration: Release-Linux

    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Set up
        uses: ./.github/actions/setup-broiler

      - name: Publish
        run: dotnet publish ${{ matrix.project }} -c ${{ matrix.configuration }}
