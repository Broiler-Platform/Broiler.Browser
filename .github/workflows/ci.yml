name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# `packages: read` and the GitHub Packages credential that used to sit under `env:`
# are gone with the feed they were for. NuGet.config restores from nuget.org alone,
# which answers anonymously, so nothing here needs a token to restore.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

# THERE ARE NO SUBMODULES ANY MORE, AND NO JOB HERE CHECKS ONE OUT.
#
# Every component the browser composes -- Broiler.HTML, Broiler.HtmlBridge,
# Broiler.JS, Broiler.VM, Broiler.Graphics, Broiler.Input, Broiler.UI and the rest --
# is a PackageReference from nuget.org; the last gitlinks went in 37e6ea7 and 04f65ae.
# The `Submodule pins` job that proved every gitlink existed on its remote left with them,
# as its own failure message asked; `submodules: true` on the checkouts and the
# nested-submodule initialisation in .github/actions/setup-broiler went with it.
# A plain checkout is the whole of what a job here needs.

jobs:
  # Two sources shipping an assembly of the same name into one output directory is
  # the failure mode this repository keeps hitting: both arrive, the copy to the
  # output directory keeps one of them, and the loser's callers die at runtime with a
  # TypeLoadException that names a method rather than a build problem. It shipped
  # once as PngImageCodec.DecodeAsync, and Debug and Release had picked different
  # winners.
  #
  # With the components consumed as packages the route is a package -- one that
  # bundles a copy of an assembly another package owns -- or a project here that
  # produces an assembly a package already brings, which is exactly what 7b13f21 had
  # to take out of the heads. So the check restores and reads the package closure as
  # well as the project graph. It builds nothing, so it runs in a couple of minutes
  # and fails before the long jobs do.
  graph:
    name: Component graph
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up
        uses: ./.github/actions/setup-broiler

      # Broiler.Android.Browser.slnx is absent deliberately: evaluating it needs the
      # android workload, which this job does not install and should not pay for.
      # The `android` job checks that one, after the install it already does.
      - name: Verify one assembly per name
        shell: bash
        run: |
          ./scripts/check-component-graph.sh \
            Broiler.Windows.Browser.slnx \
            Broiler.Linux.Browser.slnx \
            Broiler.Browser.Tests.slnx

      # THIS PASS ASKS ABOUT A DIFFERENT CLOSURE AGAIN.
      #
      # For a while it did not, and this comment said so: while the Broiler.VM
      # projects were submodule checkouts, scripts/update-solutions.ps1 wrote every
      # ProjectReference into every .slnx regardless of its Condition, so both passes
      # evaluated the same project list. Now the -VM pair's one conditional reference
      # is a PACKAGE -- Broiler.HtmlBridge.Scripting.Vm, in
      # src/Broiler.Browser.Core -- and the restore this check runs honours its
      # Condition. Under Debug-VM the closure gains that package and the Broiler.VM
      # packages behind it, and this is the only pass that looks at them. Measured on
      # 2026-09-24: 74 packages for the Windows and Linux heads under Debug, 82 under
      # Debug-VM.
      - name: Verify one assembly per name (VM profile)
        shell: bash
        env:
          CONFIGURATION: Debug-VM
        run: |
          ./scripts/check-component-graph.sh \
            Broiler.Windows.Browser.slnx \
            Broiler.Linux.Browser.slnx \
            Broiler.Browser.Tests.slnx

      # Declaring the names is a SEPARATE problem from making them behave, and it
      # is the one no command-line build can notice. Visual Studio maps a solution
      # build type onto a project configuration of the same name and refuses when
      # the project has none; `dotnet build -c Debug-VM` just builds. So Debug-VM
      # shipped, passed every job below, and still gave
      #
      #   Invalid project mappings. See log file
      #
      # against 87 of the 88 projects in the Windows solution the first time anyone
      # opened it. eng/Broiler.ConfigurationNames.targets is the fix; this is the
      # only thing on this side that can see whether it still works. The solutions
      # list only this repository's own projects now, which is fewer to ask and not
      # a reason to stop asking: src/Broiler.Browser.Core and the test project still
      # declare no <Configurations> of their own.
      #
      # Broiler.Android.Browser.slnx is checked from the `android` job, which
      # installs the workload its projects need. Evaluation only, like the passes
      # above.
      - name: Verify every project declares every build type
        shell: bash
        run: |
          ./scripts/check-configuration-names.sh \
            Broiler.Windows.Browser.slnx \
            Broiler.Linux.Browser.slnx \
            Broiler.Browser.Tests.slnx

      # A configuration name the SDK does not recognise gets neither Optimize nor
      # DebugSymbols: `-c Release-VM` would compile UNOPTIMISED, succeed, and say
      # nothing. eng/Broiler.Configurations.props is what stops that.
      #
      # This used to pin one project per checked-out component, because the
      # submodules reached the mapping by three different routes (the root props,
      # the root targets, and a chain in Broiler.JS's own targets). The components
      # are packages now and arrive compiled, so their configuration is their own
      # repository's business, and every project left reaches the mapping through
      # Directory.Build.props. What is still worth pinning is that every one of them
      # does -- a project that stopped chaining would compile unoptimised in silence
      # -- and that the -VM pair still selects the VM engine at all:
      # $(BroilerJavaScriptEngine) is what the conditional PackageReference and the
      # BROILER_VM_JS constant both key on, and if the mapping stopped setting it,
      # every -VM job below would quietly build and test the Broiler.JS engine
      # instead. Evaluation only; no project is built.
      #
      # The two Android projects are left out for the same reason as above: they
      # need the workload to evaluate at all.
      - name: Pin that the configuration mapping reaches every project
        shell: bash
        run: |
          set -uo pipefail
          status=0

          property() {
            dotnet msbuild "$1" -p:Configuration="$2" -getProperty:"$3" -nologo 2>/dev/null | tr -d '[:space:]'
          }

          expect() {
            local configuration="$1" name="$2" want="$3" project="$4" got
            got="$(property "$project" "$configuration" "$name")"
            if [ "$got" = "$want" ]; then
              printf '   ok  %-10s %s=%s  %s\n' "$configuration" "$name" "${want:-<empty>}" "$project"
            else
              echo "::error file=$project::Under $configuration this project answers $name='$got'; docs/vm-javascript-profile.md says '$want'. The answer comes from the mapping in eng/Broiler.Configurations.props; change that document and this step together with it."
              status=1
            fi
          }

          for project in \
            src/Broiler.Browser.Core/Broiler.Browser.Core.csproj \
            src/Broiler.Browser.Windows/Broiler.Browser.Windows.csproj \
            src/Broiler.Browser.Linux/Broiler.Browser.Linux.csproj \
            src/Broiler.Browser.Core.Tests/Broiler.Browser.Core.Tests.csproj \
            src/Broiler.Browser.Cli/Broiler.Browser.Cli.csproj \
            src/Broiler.Browser.Cli.Tests/Broiler.Browser.Cli.Tests.csproj
          do
            expect Release-VM Optimize true "$project"
          done

          # The engine selection, on the one project that reads it.
          expect Release-VM BroilerJavaScriptEngine Vm src/Broiler.Browser.Core/Broiler.Browser.Core.csproj
          expect Release BroilerJavaScriptEngine BroilerJs src/Broiler.Browser.Core/Broiler.Browser.Core.csproj

          exit "$status"

      # The mapping must apply ONCE. It is imported from Directory.Build.props and
      # again from Directory.Build.targets under a sentinel, and the
      # '$(BroilerBaseConfiguration)' guard in eng/Broiler.Configurations.props also
      # stops a configuration that is already decomposed from being decomposed
      # again. Without them RELEASE and WINDOWS were appended twice -- harmless to
      # the compiler, but it makes the constants list depend on which project you
      # ask, which is the question that file exists to answer.
      #
      # The components whose vendored copy of the mapping made this likeliest --
      # Broiler.JS and Broiler.HtmlBridge -- are packages now and no longer evaluated
      # here. What is left is this repository's own two imports, asked of the heads
      # under the runtime-identifier-pinned configuration each publishes with, and
      # of Broiler.Browser.Core beneath them.
      - name: Verify the mapping is applied once
        shell: bash
        run: |
          set -uo pipefail
          status=0

          for pair in \
            Release-Windows:src/Broiler.Browser.Core/Broiler.Browser.Core.csproj \
            Release-Windows:src/Broiler.Browser.Windows/Broiler.Browser.Windows.csproj \
            Release-Linux:src/Broiler.Browser.Linux/Broiler.Browser.Linux.csproj
          do
            configuration="${pair%%:*}"
            project="${pair#*:}"
            constants="$(dotnet msbuild "$project" -p:Configuration="$configuration" -getProperty:DefineConstants -nologo 2>/dev/null | tr -d '[:space:]')"
            count="$(printf '%s' "$constants" | tr ';' '\n' | grep -c '^RELEASE$' || true)"
            if [ "$count" = "1" ]; then
              printf '   ok  RELEASE x1  %-16s %s\n' "$configuration" "$project"
            else
              echo "::error file=$project::$configuration defines RELEASE $count times ($constants). The configuration mapping ran more than once; see the guard in eng/Broiler.Configurations.props."
              status=1
            fi
          done

          exit "$status"

  # THE ENGINE-NEUTRALITY JOB LEFT WITH THE CODE IT MEASURED.
  #
  # eng/jseal-budget.json and scripts/check-engine-neutrality.sh were a ratchet over
  # src/Broiler.HtmlBridge.*: how much of the DOM bridge still names a JavaScript engine
  # directly, project by project, with every count allowed to fall and never to rise. That
  # is a fact about the bridge, and the bridge is now the Broiler.HtmlBridge component,
  # which runs the same check in its own CI over its own src/ and reaches this repository
  # as packages.
  #
  # Seven entries in that budget named projects in THIS repository and none of them was
  # what the ratchet was about. Six were 0/0/0. The seventh was Broiler.Browser.Core,
  # because BrowserApp.NewScriptEngine() still picks an engine with an #if rather than
  # through JsEngineRegistry -- an EMBEDDER's coupling, argued where the embedder lives,
  # and no longer measured by a file in a component it does not own. It no longer
  # references Broiler.JavaScript.All directly; Broiler.JS reaches it through the
  # Broiler.HtmlBridge packages, and the #if is what is left of the coupling.
  #
  # If that coupling is ever to fall to zero, this is where a check for it belongs. There
  # is deliberately none today rather than a vacuous one: a check over a single number that
  # nobody is currently moving is a job that only ever reports success.

  # The .slnx files are generated from eng/solutions.json. A hand-edit to one is
  # silently reverted by the next generator run, so the only thing keeping them
  # true is failing here when a checked-in solution no longer matches the real
  # reference graph. This also catches the subtler case: adding a ProjectReference
  # without regenerating leaves the new project out of every solution.
  solutions:
    name: Solution manifest
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up
        uses: ./.github/actions/setup-broiler

      - name: Verify the generated solutions
        shell: pwsh
        run: ./scripts/update-solutions.ps1 -Verify

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false
      matrix:
        include:
          # The Windows head targets net10.0-windows and renders through Direct2D,
          # so it only builds on Windows.
          - name: Windows head
            os: windows-latest
            solution: Broiler.Windows.Browser.slnx
            configuration: Release
            test: false
          # The Linux head is plain net10.0 with P/Invoke into X11 and GL, so it
          # compiles anywhere; building it on Linux keeps that honest.
          - name: Linux head
            os: ubuntu-latest
            solution: Broiler.Linux.Browser.slnx
            configuration: Release
            test: false
          # The suite is all net10.0. Running it on both hosts is deliberate: the
          # shared chrome does clipboard and file-dialog work that is easy to make
          # accidentally platform-specific.
          - name: Tests (Linux)
            os: ubuntu-latest
            solution: Broiler.Browser.Tests.slnx
            configuration: Release
            test: true
          - name: Tests (Windows)
            os: windows-latest
            solution: Broiler.Browser.Tests.slnx
            configuration: Release
            test: true
          # Release-VM builds the browser against the Broiler.VM JavaScript profile
          # (docs/vm-javascript-profile.md). VmScriptEngineTests and the JSEAL
          # conformance cases left for Broiler.HtmlBridge with the engine seam; what
          # this entry still asks is the embedder's question -- the browser's own host
          # code (page loading, the render pipeline, the form controls) run against
          # an engine that is not Broiler.JS, because BrowserApp.NewScriptEngine()
          # picks the VM one under this configuration. A configuration nothing builds
          # is a configuration that rots, and this one changes the package graph
          # rather than just a runtime identifier.
          - name: Tests (Linux, VM profile)
            os: ubuntu-latest
            solution: Broiler.Browser.Tests.slnx
            configuration: Release-VM
            test: true
          # And one real head under the same configuration, on the other host: the
          # heads add the platform backends over Broiler.Browser.Core, and the
          # Windows one is the combination -- net10.0-windows plus the VM's net10.0
          # assemblies -- that nothing else here covers.
          - name: Windows head (VM profile)
            os: windows-latest
            solution: Broiler.Windows.Browser.slnx
            configuration: Release-VM
            test: false

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up
        uses: ./.github/actions/setup-broiler

      - name: Build
        run: dotnet build ${{ matrix.solution }} -c ${{ matrix.configuration }}

      - name: Test
        if: matrix.test
        run: dotnet test ${{ matrix.solution }} -c ${{ matrix.configuration }} --no-build

  # Split out because it needs the android workload, which costs several minutes
  # the other jobs should not pay for.
  android:
    name: Android head
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up
        uses: ./.github/actions/setup-broiler

      # net10.0-android needs the workload for the Mono runtime packs; without it
      # the restore fails outright rather than degrading.
      - name: Install the Android workload
        run: dotnet workload install android

      # The other three solutions are checked in the `graph` job; this one needs the
      # workload installed above to evaluate at all, so it is checked here -- in both
      # profiles, like the others, since the -VM pair changes its package closure too.
      - name: Verify one assembly per name
        shell: bash
        run: ./scripts/check-component-graph.sh Broiler.Android.Browser.slnx

      - name: Verify one assembly per name (VM profile)
        shell: bash
        env:
          CONFIGURATION: Debug-VM
        run: ./scripts/check-component-graph.sh Broiler.Android.Browser.slnx

      - name: Verify every project declares every build type
        shell: bash
        run: ./scripts/check-configuration-names.sh Broiler.Android.Browser.slnx

      - name: Build
        run: dotnet build Broiler.Android.Browser.slnx -c Release

  # The heads publish through configurations the solutions do not declare
  # (Release-Windows / Release-Linux pin win-x64 and linux-x64). Those have to be
  # project-level builds — a solution-level build with an undeclared configuration
  # fails MSB4126 — so they are exercised here rather than in `build`, and this is
  # the path release.yml takes.
  publish:
    name: Publish ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            project: src/Broiler.Browser.Windows/Broiler.Browser.Windows.csproj
            configuration: Release-Windows
          - os: ubuntu-latest
            rid: linux-x64
            project: src/Broiler.Browser.Linux/Broiler.Browser.Linux.csproj
            configuration: Release-Linux

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up
        uses: ./.github/actions/setup-broiler

      - name: Publish
        run: dotnet publish ${{ matrix.project }} -c ${{ matrix.configuration }}
