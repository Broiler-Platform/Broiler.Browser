name: Release

# Dispatch-only. Every run builds the Windows and Linux browser as self-contained single-file
# executables and the Android browser as a release-signed app bundle and APK, stamps all of
# them with the next preview version, attaches them to the run as artifacts, then drafts a
# GitHub pre-release carrying them:
#
#   Broiler.Browser-<version>-win-x64.zip     Broiler.Browser.Windows.exe
#   Broiler.Browser-<version>-linux-x64.zip   Broiler.Browser.Linux
#   Broiler.Browser-<version>.aab             app bundle (arm64 + x86_64), attached as it is
#   Broiler.Browser-<version>-arm64.apk       attached as it is
#
# This is Broiler.Writer's Publish workflow with one deliberate difference: the desktop
# executables are single-file, not NativeAOT. Under NativeAOT the browser does not start.
# Broiler.JS builds its object model by reflecting over runtime members the AOT compiler
# trims away: JSObjectBuilder's static constructor throws MethodAccessException for
# JSObject.FastAddValue from a module initializer, before Main. That is the first failure,
# not necessarily the last; Broiler.JavaScript.BuiltIns and .LinqExpressions both raise AOT
# analysis warnings (IL3053) when published that way. A self-contained single-file
# executable keeps the JIT and is still the whole application: the .NET runtime and every
# assembly inside one file, nothing to install, nothing beside it. It is not trimmed, for
# the same reflection.
#
# The optimizations live in the head projects, so this workflow, ci.yml's publish job and a
# publish from Visual Studio all get them. The desktop executables are ReadyToRun (startup
# on precompiled code; 31% less time to a finished page, 31 MB more executable) with tiered
# compilation and dynamic PGO. The Android packages are AOT-compiled from the startup
# profile and trimmed in partial mode, which AOT requires, with Broiler.JS kept whole (the
# Android head roots the one assembly of it that claims to be trimmable and is not); the
# collect step below fails a package without its AOT code.
#
# The Android packages are signed with the release key held in the ANDROID_KEYSTORE_BASE64,
# ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD repository secrets
# (the monorepo's and Broiler.Writer's, under the same names) by eng/sign-android-packages.ps1.
#
# Nothing is pushed to a feed. The draft release (eng/release-draft.sh) stays private until
# someone publishes it.
#
# The version is BroilerBrowserVersion (Directory.Build.props) raised past every earlier
# run's browser-v* tag, and a successful run tags its commit, so preview numbers only ever
# increase and never name two builds. See eng/resolve-preview-version.mjs.
#
# There is no nuget-source input, unlike Broiler.Writer's: NuGet.config here restores
# everything from nuget.org and declares no GitHub Packages source to switch to.
on:
  workflow_dispatch:
    inputs:
      version-suffix:
        description: >-
          Optional preview.N override (unused, and at least the next preview). Empty picks
          the next preview automatically.
        type: string
        default: ''

permissions:
  contents: read

# One run at a time, so two runs cannot pick the same preview number.
concurrency:
  group: release
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  version:
    name: Resolve preview version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      version-code: ${{ steps.version.outputs.version-code }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up
        uses: ./.github/actions/setup-broiler

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Test the version resolver
        run: node --test eng/resolve-preview-version.test.mjs

      - name: Resolve version
        id: version
        env:
          VERSION_SUFFIX: ${{ inputs.version-suffix }}
        run: node eng/resolve-preview-version.mjs

  build:
    name: ${{ matrix.rid }} (single-file)
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: true
      matrix:
        include:
          # The pinned configurations are the ones FolderProfile.pubxml names and they
          # carry the runtime identifier a self-contained publish needs.
          - os: windows-latest
            rid: win-x64
            project: src/Broiler.Browser.Windows/Broiler.Browser.Windows.csproj
            configuration: Release-Windows
            executable: Broiler.Browser.Windows.exe
          # The Linux head is plain net10.0 and could be published from anywhere; publishing
          # it on Linux keeps the host that builds it the one it runs on.
          - os: ubuntu-latest
            rid: linux-x64
            project: src/Broiler.Browser.Linux/Broiler.Browser.Linux.csproj
            configuration: Release-Linux
            executable: Broiler.Browser.Linux

    env:
      VERSION: ${{ needs.version.outputs.version }}
      OUT: artifacts/publish/${{ matrix.rid }}

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up
        uses: ./.github/actions/setup-broiler

      # Self-contained and single-file: one executable carrying the .NET runtime and every
      # assembly. IncludeNativeLibrariesForSelfExtract bundles any native library a package
      # brings too, rather than leaving it beside the executable. ci.yml's publish job uses
      # the same switches; ReadyToRun and tiered PGO come from the head project.
      # BroilerBrowserVersion flows into Version, so the file version matches the artifact.
      # ContinuousIntegrationBuild makes the build deterministic, with source paths in the
      # symbols normalised rather than the runner's.
      - name: Publish
        run: |
          dotnet publish '${{ matrix.project }}' \
            -c '${{ matrix.configuration }}' \
            --self-contained \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:ContinuousIntegrationBuild=true \
            -p:BroilerBrowserVersion="$VERSION" \
            -o "$OUT"

      # The artifact is the executable alone. Symbols (.pdb, and Linux's detached .dbg) and
      # XML docs are dead weight next to it; anything else would be a file the application
      # needs, so shipping without it would be broken - fail rather than drop it.
      - name: Check that the executable is the whole application
        run: |
          others=$(find "$OUT" -type f ! -name '${{ matrix.executable }}' \
            ! -name '*.pdb' ! -name '*.dbg' ! -name '*.xml')
          if [ ! -f "$OUT/${{ matrix.executable }}" ] || [ -n "$others" ]; then
            echo "::error::Expected only ${{ matrix.executable }} in the publish output."
            find "$OUT" -type f
            exit 1
          fi

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: broiler-browser-${{ matrix.rid }}-${{ env.VERSION }}
          path: ${{ env.OUT }}/${{ matrix.executable }}
          if-no-files-found: error

  android:
    name: android (signed .aab + arm64 .apk)
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      # The signing certificate's fingerprint, for the release notes. A certificate is public
      # by construction - it is what a download is checked against, not key material.
      signing-certificate-sha256: ${{ steps.sign.outputs.certificate-sha256 }}

    defaults:
      run:
        shell: pwsh

    env:
      VERSION: ${{ needs.version.outputs.version }}
      VERSION_CODE: ${{ needs.version.outputs.version-code }}
      PROJECT: src/Broiler.Browser.Android/Broiler.Browser.Android.csproj
      # The compile API and the build-tools track the android workload's Microsoft.Android.Sdk
      # major, as in the monorepo's preview package workflow.
      ANDROID_API_LEVEL: '36'
      ANDROID_BUILD_TOOLS: 36.0.0

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up
        uses: ./.github/actions/setup-broiler

      - name: Set up the JDK the signing tools run on
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # The release key lives in four repository secrets, the same ones the monorepo's
      # "Prepare Broiler Preview Package" workflow and Broiler.Writer's Publish workflow use.
      # Checked before the build, so a missing or wrong secret fails in seconds rather than
      # after it.
      - name: Check the Android signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./eng/sign-android-packages.ps1 -ValidateOnly | Out-Null

      - name: Install the Android workload
        run: |
          dotnet workload install android
          if ($LASTEXITCODE -ne 0) { throw "dotnet workload install android exited with code $LASTEXITCODE." }

      # The runner ships an Android SDK, but not necessarily the API level the head compiles
      # against: install what is missing rather than a second SDK beside it.
      - name: Provision the Android SDK
        run: |
          $sdkRoot = if ($env:ANDROID_HOME) { $env:ANDROID_HOME } else { $env:ANDROID_SDK_ROOT }
          if (-not $sdkRoot) { throw 'Neither ANDROID_HOME nor ANDROID_SDK_ROOT is set; this runner has no Android SDK.' }
          $platformJar = Join-Path $sdkRoot "platforms/android-$env:ANDROID_API_LEVEL/android.jar"
          $buildTools = Join-Path $sdkRoot "build-tools/$env:ANDROID_BUILD_TOOLS"
          if (-not (Test-Path $platformJar) -or -not (Test-Path $buildTools)) {
            $sdkManager = Join-Path $sdkRoot 'cmdline-tools/latest/bin/sdkmanager'
            if (-not (Test-Path $sdkManager)) { throw "The Android SDK at $sdkRoot lacks API $env:ANDROID_API_LEVEL and has no sdkmanager." }
            ("y`n" * 50) | & $sdkManager --sdk_root="$sdkRoot" --licenses | Out-Null
            & $sdkManager --sdk_root="$sdkRoot" "platforms;android-$env:ANDROID_API_LEVEL" "build-tools;$env:ANDROID_BUILD_TOOLS"
          }
          if (-not (Test-Path $platformJar)) { throw "android.jar is missing after provisioning: $platformJar" }
          "ANDROID_HOME=$sdkRoot" >> $env:GITHUB_ENV
          "ANDROID_SDK_ROOT=$sdkRoot" >> $env:GITHUB_ENV

      # Mono, not NativeAOT: the Android SDK still flags NativeAOT as experimental (XA1040),
      # and Broiler.JS does not start under desktop NativeAOT (see the top of this file). Under
      # Release the head AOT-compiles its startup profile and trims in partial mode itself.
      # Plain Release is a configuration the head switches to an app bundle under; the APK
      # overrides the format and narrows to arm64, the one ABI a phone needs. The ABI goes
      # through BroilerAndroidAbis, not RuntimeIdentifiers, which as a global property would
      # reach every net10.0 library and fail NETSDK1047. ApplicationVersion is the versionCode.
      - name: Publish the app bundle and the arm64 APK
        run: |
          $common = @('-c', 'Release', '-p:ContinuousIntegrationBuild=true', "-p:BroilerBrowserVersion=$env:VERSION", "-p:ApplicationVersion=$env:VERSION_CODE")
          dotnet publish $env:PROJECT @common -o artifacts/android/aab
          if ($LASTEXITCODE -ne 0) { throw 'Publishing the app bundle failed.' }
          dotnet publish $env:PROJECT @common -p:AndroidPackageFormat=apk -p:BroilerAndroidAbis=android-arm64 -o artifacts/android/apk
          if ($LASTEXITCODE -ne 0) { throw 'Publishing the APK failed.' }

      # Each publish leaves the unsigned org.broiler.browser.<ext> beside a -Signed copy
      # carrying the workload's debug key. The unsigned one is carried forward and signed with
      # the release key; checking it here means neither format can ship under the other's name
      # and a debug-signed package cannot arrive looking release-ready. Each ABI must also carry
      # AOT code (lib/<abi>/libaot-*.so): a package without it starts on the JIT alone and
      # otherwise looks exactly like one with it.
      - name: Collect and verify the packages
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          function Get-Entries($Path) {
            $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $Path))
            try { @($zip.Entries | ForEach-Object FullName) } finally { $zip.Dispose() }
          }
          function Get-Abis($Entries) {
            @($Entries | ForEach-Object { if ($_ -match '^(?:base/)?lib/([^/]+)/.') { $Matches[1] } } | Sort-Object -Unique)
          }
          function Assert-Unsigned($Path, $Entries) {
            $signature = @($Entries | Where-Object { $_ -match '^META-INF/.+\.(RSA|DSA|EC|SF)$' })
            if ($signature) { throw "$Path is already signed; the debug-signed package was picked up." }
          }
          function Assert-Aot($Path, $Entries, $Abis) {
            foreach ($abi in $Abis) {
              $aot = @($Entries | Where-Object { $_ -match "^(?:base/)?lib/$abi/libaot-.+\.so$" })
              if ($aot.Count -eq 0) { throw "$Path carries no AOT code for $abi; RunAOTCompilation did not take effect." }
              Write-Host "==> ${Path}: $($aot.Count) AOT images for $abi"
            }
          }

          $out = 'artifacts/android/signed'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $bundle = 'artifacts/android/aab/org.broiler.browser.aab'
          $apk = 'artifacts/android/apk/org.broiler.browser.apk'
          foreach ($p in $bundle, $apk) {
            if (-not (Test-Path $p)) { throw "Expected $p; the publish produced: $(Get-ChildItem (Split-Path $p) -Name)" }
          }

          $entries = Get-Entries $bundle
          if ($entries -notcontains 'BundleConfig.pb') { throw "$bundle is not an app bundle: BundleConfig.pb is missing." }
          Assert-Unsigned $bundle $entries
          Assert-Aot $bundle $entries (Get-Abis $entries)
          Write-Host "==> ${bundle}: app bundle, ABIs $((Get-Abis $entries) -join ', ')"

          $entries = Get-Entries $apk
          if ($entries -notcontains 'AndroidManifest.xml' -or $entries -contains 'BundleConfig.pb') { throw "$apk is not an APK." }
          $abis = @(Get-Abis $entries)
          if ($abis.Count -ne 1 -or $abis[0] -ne 'arm64-v8a') { throw "$apk should carry arm64-v8a only; found: $($abis -join ', ')" }
          Assert-Unsigned $apk $entries
          Assert-Aot $apk $entries $abis
          Write-Host "==> ${apk}: apk, arm64-v8a"

          Copy-Item $bundle "$out/Broiler.Browser-$env:VERSION.aab"
          Copy-Item $apk "$out/Broiler.Browser-$env:VERSION-arm64.apk"

      # The .aab is signed with jarsigner, the .apk zipaligned and signed with apksigner; the
      # script verifies both against the release certificate and returns its fingerprint.
      - name: Sign the packages
        id: sign
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          $out = 'artifacts/android/signed'
          $fingerprint = ./eng/sign-android-packages.ps1 `
            -BundlePath "$out/Broiler.Browser-$env:VERSION.aab" `
            -ApkPath "$out/Broiler.Browser-$env:VERSION-arm64.apk"
          if ([string]::IsNullOrWhiteSpace($fingerprint)) { throw 'The signing script returned no certificate fingerprint.' }
          "certificate-sha256=$fingerprint" >> $env:GITHUB_OUTPUT

      # The run artifact is zipped by GitHub like any other; the release attaches the .aab and
      # the .apk themselves (eng/release-draft.sh), each already an archive and signed.
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: broiler-browser-android-${{ env.VERSION }}
          path: artifacts/android/signed/*
          if-no-files-found: error

  release:
    name: Tag and draft release ${{ needs.version.outputs.tag }}
    needs: [version, build, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}

    steps:
      - name: Check out
        uses: actions/checkout@v7

      # Only after every platform built: a failed run leaves its number free. The tag is
      # pushed here rather than left to the release, because a draft release does not
      # create its tag until it is published - and the next run counts tags.
      - name: Tag the commit
        run: |
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"

      - name: Download the packages
        uses: actions/download-artifact@v8
        with:
          pattern: broiler-browser-*
          path: artifacts

      # A draft pre-release: nothing is public until someone reviews and publishes it.
      - name: Draft the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANDROID_SIGNING_CERT_SHA256: ${{ needs.android.outputs.signing-certificate-sha256 }}
        run: bash eng/release-draft.sh "$VERSION" artifacts

      - name: Summary
        run: |
          {
            echo "### Broiler.Browser $VERSION"
            echo
            echo "Commit tagged \`$TAG\`."
            echo
            echo "A draft pre-release **Broiler Browser $VERSION** was created with"
            echo "\`Broiler.Browser-$VERSION-win-x64.zip\`, \`Broiler.Browser-$VERSION-linux-x64.zip\`,"
            echo "\`Broiler.Browser-$VERSION.aab\` and \`Broiler.Browser-$VERSION-arm64.apk\`."
            echo "Review it under Releases and publish it there."
          } >> "$GITHUB_STEP_SUMMARY"
